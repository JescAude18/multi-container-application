services:
  mongodb:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    ports:
      - "${MONGODB_LOCAL_PORT}:${MONGODB_DOCKER_PORT}"
    volumes:
      - db:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

  app:
    depends_on:
      - mongodb
    build:
      context: .
      dockerfile: dockerfile.api
    restart: always
    ports:
      - "${NODE_LOCAL_PORT}:${NODE_DOCKER_PORT}"
    environment:
      - MONGO_URL=mongodb://${MONGODB_APP_USER}:${MONGODB_APP_PASSWORD}@mongodb:${MONGODB_DOCKER_PORT}/${MONGODB_DATABASE}

volumes:
  db:
