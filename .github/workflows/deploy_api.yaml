---

name: Multi Container Service Deployment with Docker Hub

on:
  push:
    branches:
      - 'main'

  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/jescocker/multi-container-service

jobs:
  prepare_image:
    runs-on: ubuntu-24.04

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile.api
          push: true
          tags: "${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy:
      needs: prepare_image

      runs-on: ubuntu-24.04

      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"

      steps:

        - name: Checkout repository
          uses: actions/checkout@v5

        - name: Install Ansible
          run: |
            sudo apt-get update
            sudo apt-get install -y ansible

        - name: Setup SSH key to connect to VM
          uses: webfactory/ssh-agent@v0.10.0
          with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

        - name: Create Ansible Vault Password file
          env:
            ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          run: |
            printf '%s' "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
            chmod 600 /tmp/vault_pass

        - name: Run Node.js API and MongoDB Containers on the VM via Playbook
          env:
            IMAGE_NAME: ${{ env.IMAGE_NAME }}
          run: |
            ansible-playbook -i ansible/inventory.ini ansible/setup.yml \
            -e "api_image=$IMAGE_NAME:${{ github.sha }}" \
            --vault-password-file /tmp/vault_pass

        - name: Remove temporary Vault password file
          if: always()
          run: |
            rm -rf /tmp/vault_pass
