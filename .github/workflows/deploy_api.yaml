---

# Give the workflow a descriptive name in the GitHub Actions interface.
name: Multi Container Service Deployment with Docker Hub

# Run the workflow automatically after changes are pushed to the main branch.
# workflow_dispatch also allows an authorized user to start the deployment manually.
on:
  push:
    branches:
      - 'main'

  workflow_dispatch:

# Keep the Docker image repository in one place so every job uses the same value.
env:
  IMAGE_NAME: docker.io/jescocker/multi-container-service

jobs:
  # Build the API image and publish it before the deployment job starts.
  prepare_image:
    # Use a fresh Ubuntu runner supplied by GitHub for the image preparation.
    runs-on: ubuntu-24.04

    steps:

      # Download the repository so the Dockerfile and application source are available.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Authenticate to Docker Hub so the workflow can push the built image.
      # The username is a repository variable and the token remains a secret.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Install and configure Docker Buildx for the image build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the API image from its dedicated Dockerfile and publish it.
      # The commit SHA makes the image immutable and identifies the deployed version.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile.api
          push: true
          tags: "${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy:
      # Do not deploy until the image has been built and pushed successfully.
      needs: prepare_image

      # Use a clean Ubuntu runner for the Ansible deployment commands.
      runs-on: ubuntu-24.04

      env:
        # The VM host key is managed outside this ephemeral runner.
        ANSIBLE_HOST_KEY_CHECKING: "False"

      steps:

        # Download the Ansible playbook and its supporting files.
        - name: Checkout repository
          uses: actions/checkout@v5

        # Install Ansible on the temporary GitHub Actions runner.
        - name: Install Ansible
          run: |
            sudo apt-get update
            sudo apt-get install -y ansible

        # Load the private SSH key used by Ansible to connect to the target VM.
        - name: Setup SSH key to connect to VM
          uses: webfactory/ssh-agent@v0.10.0
          with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

        # Create a short-lived file containing the password used to decrypt Ansible Vault data.
        # Restricting its permissions prevents other users on the runner from reading it.
        - name: Create Ansible Vault Password file
          env:
            ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          run: |
            printf '%s' "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
            chmod 600 /tmp/vault_pass

        # Run the playbook on the VM and pass it the exact image built in this workflow.
        - name: Run Node.js API and MongoDB Containers on the VM via Playbook
          env:
            IMAGE_NAME: ${{ env.IMAGE_NAME }}
          run: |
            ansible-playbook -i ansible/inventory.ini ansible/setup.yaml \
            -e "api_image=$IMAGE_NAME:${{ github.sha }}" \
            --vault-password-file /tmp/vault_pass

        # Always remove the temporary Vault password, including after a failed deployment.
        - name: Remove temporary Vault password file
          if: always()
          run: |
            rm -rf /tmp/vault_pass
