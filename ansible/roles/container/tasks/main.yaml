---

- name: Create application directory
  ansible.builtin.file:
    path: /application/multi-container-service/
    state: directory
    mode: '0755'

- name: Copy user creation script on VM
  ansible.builtin.copy:
    src: ../../../mongodb-init/
    dest: /application/multi-container-service/mongodb-init/
    mode: '0755'

- name: Copy docker-compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: /application/multi-container-service/docker-compose.yaml
    mode: '0600'

- name: Run Node.js API and MongoDB containers
  community.docker.docker_compose_v2:
    project_src: /application/multi-container-service/
    state: present
    pull: always
    wait: true
